<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Film scheduling</title>
<style>
:root{--bg:#f2f4f6;--sf:#fff;--ink:#16202b;--mu:#5e6b78;--ln:#d5dce3;--ac:#0b5cad;--ai:#fff;--hi:#e8a317;--bad:#b3372b;--ok:#1d7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--sf:#18222c;--ink:#e8eef3;--mu:#97a6b3;--ln:#2b3a47;--ac:#5aa8f0;--ai:#07203a;--bad:#ff8a7a;--ok:#5fd394}}
:root[data-theme="dark"]{--bg:#0f161d;--sf:#18222c;--ink:#e8eef3;--mu:#97a6b3;--ln:#2b3a47;--ac:#5aa8f0;--ai:#07203a;--bad:#ff8a7a;--ok:#5fd394}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:1.4rem;margin:4px 0}h2{font-size:1.05rem;margin:20px 0 8px}
.mu{color:var(--mu)}.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin:8px 0;overflow-x:auto}
button,select,input,textarea{font:inherit;color:var(--ink)}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:4px solid transparent;padding:12px 14px;font-weight:700;color:var(--mu);cursor:pointer;min-height:48px}
.tab.on{color:var(--ink);border-color:var(--hi)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}.row>*{flex:1 1 200px}
label{display:block;font-weight:600;font-size:.85rem;margin:8px 0 3px}
select,input,textarea{width:100%;min-height:46px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;font-weight:400;font-size:1rem}.chk input{width:22px;min-height:22px;height:22px;flex:none}
.btn{background:var(--ac);color:var(--ai);border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:46px}
.btn.alt{background:none;color:var(--ac);border:1px solid var(--ac)}.btn.x{background:none;color:var(--bad);border:1px solid var(--ln);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--ln);padding:6px 0}
.tot{font-weight:800;font-size:1.1rem;margin-top:8px}
.calh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.calh .btn{min-width:56px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dw{text-align:center;font-size:.8rem;color:var(--mu)}
.c{min-height:54px;background:var(--sf);border:1.5px solid var(--ln);border-radius:8px;padding:4px 2px;cursor:pointer;font-weight:700;line-height:1.15}
.c small{display:block;font-weight:400;font-size:.7rem;opacity:.85}.c.o{opacity:.55}
.c[aria-pressed="true"]{background:var(--ac);color:var(--ai);border-color:var(--ac)}.c:disabled{opacity:.3;cursor:not-allowed}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--hi)}
.bk{border:1px solid var(--ln);border-left:6px solid var(--ln);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--sf)}.bk.new{border-left-color:var(--hi)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.acts select{width:auto;flex:0 0 auto;max-width:170px;min-height:42px;padding:6px 8px}
.msg{min-height:1.4em;margin-top:8px;font-weight:600}.bad{color:var(--bad)}.ok{color:var(--ok)}
.banner{background:var(--hi);color:#201400;border-radius:8px;padding:8px 12px;margin:8px 0;font-weight:600}
.alert{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#c62828;color:#fff;border-radius:8px;padding:12px;margin:8px 0;font-size:1.05rem;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.alert .btn{background:#fff;color:#c62828;flex:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;display:none}
textarea.cfg{min-height:380px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.tm{font-weight:800;color:var(--ac);font-size:1.05rem}
.svc{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;background:var(--sf);border:1.5px dashed var(--ln);border-radius:10px;padding:10px 14px;margin-bottom:10px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.card.on{border:2px solid var(--ac)}
.addon{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:.75rem;font-weight:700;border:1px solid var(--ln);border-radius:20px;padding:1px 8px;color:var(--mu);vertical-align:middle}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}.dlg{background:var(--sf);border-radius:12px;padding:18px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.scroll{overflow-x:auto}.sheet{border-collapse:collapse;width:100%;min-width:820px}.sheet th{white-space:nowrap}.sheet tr.dr td:first-child,.sheet th:first-child{width:6px;padding:0}.sheet tr.dr td:nth-child(2),.sheet th:nth-child(2){width:112px;white-space:nowrap}.sheet tr.dr td:nth-child(4),.sheet th:nth-child(4),.sheet tr.dr td:nth-child(5),.sheet th:nth-child(5){width:90px}.sheet tr.dr td:nth-child(6){white-space:nowrap}.sheet tr.dr td:nth-child(6) input{width:84px;display:inline-block}.sheet th:nth-child(6){width:270px}.sheet tr.dr td:nth-child(7),.sheet th:nth-child(7){width:46px}.sheet th,.sheet td{padding:4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}.sheet input{min-height:40px}.sheet tr.sh td{background:var(--bg);padding-top:14px}
.sumbar{position:sticky;bottom:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));margin-top:12px;box-shadow:0 -4px 14px rgba(0,0,0,.15)}
@media print{.tabs,.btn,.acts,#banner,#alerts,.noprint,input,select{display:none!important}body{background:#fff;color:#000}.card,.bk{border-color:#999;break-inside:avoid}}
</style>
</head>
<body>
<main>
<h1>Install Scheduler</h1>
<div id="banner"></div><div id="alerts"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<div id="modal"></div><div id="toast" role="status"></div>
<script>
const DEF={"shop": {"installers": ["Installer"], "advisors": ["Advisor 1", "Advisor 2"], "dayHours": 8, "shortJob": 4, "start": 9, "lunchAt": 13, "lunch": 1, "workDays": [1, 2, 3, 4, 5], "closed": []}, "services": [{"id": "tint", "name": "Window Tint", "tiers": ["Tier 1", "Tier 2", "Tier 3"], "options": [{"n": "2 Fronts", "h": 1, "pt": 1.5}, {"n": "Full – Small", "h": 2.5, "pt": 3}, {"n": "Full – Standard", "h": 2.5, "pt": 3}, {"n": "Full – Mid size", "h": 2.5, "pt": 4}, {"n": "Full – Large", "h": 2.5, "pt": 4}, {"n": "Windshield", "h": 1.5, "pt": 2}, {"n": "Brow", "h": 0.5, "pt": 1}, {"n": "Sunroof", "h": 1, "pt": 1.5}, {"n": "Sunroof – Panoramic/Dual", "h": 2, "pt": 3}], "addons": [{"n": "Windshield", "h": 1.5, "pt": 2}, {"n": "Brow", "h": 0.5, "pt": 1}, {"n": "Sunroof", "h": 1, "pt": 1.5}, {"n": "Sunroof – Panoramic/Dual", "h": 2, "pt": 3}]}, {"id": "tintrm", "name": "Tint Removal", "options": [{"n": "Full Vehicle", "h": 2.5, "pt": 2.5}, {"n": "2 Fronts", "h": 1, "pt": 1}, {"n": "Windshield", "h": 1, "pt": 1}], "addons": []}, {"id": "ppf", "name": "Paint Protection Film (PPF)", "options": [{"n": "City", "h": 3, "pt": 10}, {"n": "Highway", "h": 5.5, "pt": 10}, {"n": "Interstate", "h": 8, "pt": 12}], "addons": []}, {"id": "stealth", "name": "Stealth PPF", "options": [{"n": "City", "h": 3, "pt": 10}, {"n": "Highway", "h": 5.5, "pt": 10}, {"n": "Interstate", "h": 8, "pt": 12}], "addons": []}, {"id": "cppf", "name": "Color PPF", "options": [{"n": "Top only", "h": 8, "pt": 16}, {"n": "Tuxedo", "h": 12, "pt": 24}], "addons": []}, {"id": "chrome", "name": "Chrome Delete (Vinyl)", "options": [{"n": "Window trim", "h": 4, "pt": 6}], "addons": [{"n": "Door handles (pair)", "h": 1.5, "pt": 2, "q": true}, {"n": "Mirror caps", "h": 1.5, "pt": 2}, {"n": "Simple grille", "h": 2, "pt": 3}, {"n": "Complex grille", "h": 4, "pt": 6}, {"n": "Roof rails", "h": 2, "pt": 3}, {"n": "Door length accent", "h": 0.5, "pt": 1, "q": true}, {"n": "Up to 2ft accent", "h": 0.5, "pt": 1, "q": true}, {"n": "Emblem or small accent (each)", "h": 0.5, "pt": 1, "q": true}]}, {"id": "cc", "name": "Color Change (Vinyl)", "options": [{"n": "Compact", "h": 24, "pt": 41}, {"n": "Standard", "h": 24, "pt": 41}, {"n": "Compact SUV", "h": 32, "pt": 41}, {"n": "Mid size SUV/Trucks", "h": 40, "pt": 41}, {"n": "Large SUV/HD trucks/Vans", "h": 40, "pt": 41}], "addons": []}]};
const done=b=>b.status==="Done"||b.status==="Completed";
const stOf=b=>done(b)?"Done":["Approved","Ready"].includes(b.status)?b.status:"Requested";
const me=Math.random().toString(36).slice(2);
const S={tab:"sched",cfg:DEF,bookings:[],all:[],items:[],dr:{sid:DEF.services[0].id,tier:0,opt:0,ad:[]},date:null,mo:null,inst:"auto",f:{},msg:"",ok:false,can:false,q:"",from:"",qa:"all",alerts:[],editId:null,pend:0};
let db=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fh=h=>(Math.round(h*100)/100)+"h";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>new Date(s+"T00:00:00");
const lab=s=>parse(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const tIso=()=>iso(new Date());
const svc=id=>S.cfg.services.find(s=>s.id===id)||S.cfg.services[0];
const cap=()=>S.cfg.shop.dayHours,insts=()=>S.cfg.shop.installers,advs=()=>S.cfg.shop.advisors||[];
const work=d=>S.cfg.shop.workDays.includes(d.getDay())&&!(S.cfg.shop.closed||[]).includes(iso(d));
const bks=()=>S.editId?S.bookings.filter(b=>b.id!==S.editId):S.bookings;
const sh=()=>S.cfg.shop.start??9,lo=()=>(S.cfg.shop.lunchAt??12)-sh(),ll=()=>S.cfg.shop.lunch??1;
const clk=(o,end)=>sh()+o+((end?o>lo():o>=lo())?ll():0);
const tm=h=>{const H=Math.floor(h),m=Math.round((h-H)*60);return((H+11)%12+1)+":"+String(m).padStart(2,"0")+" "+(H<12?"am":"pm")};
const rng=(o,h)=>tm(clk(o,0))+" – "+tm(clk(o+h,1));
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}

const qOf=(s,it,i)=>{const a=s.addons[i];return a?(a.q?(Number(it.q&&it.q[i])||0):1):0};
function itemHours(s,it){
  const o=s.options[it.opt]||s.options[0];
  return o.h+it.ad.reduce((t,i)=>t+(s.addons[i]?s.addons[i].h*qOf(s,it,i):0),0);
}
function itemLabel(s,it){
  const o=s.options[it.opt]||s.options[0],ads=it.ad.filter(i=>s.addons[i]).map(i=>s.addons[i].n+(s.addons[i].q?" ×"+qOf(s,it,i):""));
  return s.name+" — "+(s.tiers?s.tiers[it.tier]+" · ":"")+o.n+(ads.length?" + "+ads.join(", "):"");
}
const total=()=>S.items.reduce((a,it)=>a+itemHours(svc(it.sid),it),0);
const pOf=(sv,tier,x)=>sv.tiers&&x.prt?x.prt[tier]:x.pr;
function extras(){return S.items.reduce((t,it)=>{const s=svc(it.sid),o=s.options[it.opt]||s.options[0],add=(x,n)=>{t.pt+=(Number(x.pt)||0)*n;t.pr+=(Number(pOf(s,it.tier,x))||0)*n};add(o,1);it.ad.forEach(i=>{if(s.addons[i])add(s.addons[i],qOf(s,it,i))});return t},{pt:0,pr:0})}
function qtyMissing(){const m=[];S.items.forEach(it=>{const s=svc(it.sid);it.ad.forEach(i=>{const a=s.addons[i];if(a&&a.q&&!(Number(it.q&&it.q[i])>=1))m.push(a.n)})});return m}
function usage(b){const u={};b.forEach(x=>(x.days||[]).forEach(y=>{u[x.inst]=u[x.inst]||{};u[x.inst][y.d]=(u[x.inst][y.d]||0)+y.h+(y.g||0)}));return u}
const free=(u,i,d)=>cap()-((u[i]||{})[d]||0);
function elapsed(){const n=new Date(),t=n.getHours()+n.getMinutes()/60,s=sh(),L=s+lo(),e=L+ll();const x=t<=s?0:t<=L?t-s:t<=e?lo():t-s-ll();return Math.min(cap(),Math.ceil(x*4)/4)}
const DS=b=>[...new Set(b.days.map(x=>x.d))];
function pEnd(b){let d=parse(b.start),o=(b.days[0]||{}).o||0,left=Number(b.pt)||0;for(let n=0;n<400;n++){if(work(d)){const av=cap()-o;if(left<=av+1e-9)return lab(iso(d))+" "+tm(clk(o+left,1));left-=av}d.setDate(d.getDate()+1);o=0}return ""}
const IT=b=>b.items.map(x=>x.replace(/\s*\([\d.]+h\)$/,"")).join("; ");
function occ(b){const m={};b.forEach(x=>(x.days||[]).forEach(y=>{if(y.o==null)return;const k=x.inst+"|"+y.d;(m[k]=m[k]||[]).push([y.o,y.o+y.h])}));return m}
function gaps(m,i,d){const a=[...(m[i+"|"+d]||[])],out=[];if(d===tIso())a.push([0,elapsed()]);a.sort((p,q)=>p[0]-q[0]);let c=0;a.forEach(([s,e])=>{if(s>c+1e-9)out.push([c,s]);c=Math.max(c,e)});if(c<cap()-1e-9)out.push([c,cap()]);return out}
function fit(g,s,hrs){const cp=cap(),short=hrs<=(S.cfg.shop.shortJob??4),e=Math.min(s+hrs,cp);
  if(s+hrs>cp+1e-9&&cp-s<1-1e-9)return null;
  return g.some(x=>x[0]<=s+1e-9&&x[1]>=e-1e-9)?e:null}
function plan(m,i,D,hrs,t){
  if(t==null){for(let c=0;c<cap()-1e-9;c+=.25){const r=plan(m,i,D,hrs,c);if(r)return r}return null}
  const e=fit(gaps(m,i,D),t,hrs);if(e==null)return null;
  const out=[{d:D,o:t,h:e-t}];let left=hrs-(e-t),d=parse(D);
  for(let n=0;n<150&&left>1e-9;n++){d.setDate(d.getDate()+1);if(!work(d))continue;const k=iso(d),h=Math.min(left,cap());
    if(!gaps(m,i,k).some(x=>x[0]<=1e-9&&x[1]>=h-1e-9))return null;
    out.push({d:k,o:0,h});left-=h}
  return left>1e-9?null:out;
}
function starts(m,D,hrs){const out=[];for(let t=0;t<cap()-1e-9;t+=.25)if(insts().some((_,i)=>plan(m,i,D,hrs,t)))out.push(t);return out}
function slots(d,i,all){const r=[];all.forEach(b=>{if(b.inst!==i)return;(b.days||[]).forEach(x=>{if(x.d===d&&x.o!=null)r.push({b,o:x.o,h:x.h})})});return r.sort((p,q)=>p.o-q.o)}
function dayList(from){const a=[],d=from?parse(from):new Date();d.setHours(0,0,0,0);for(let n=0;n<150&&a.length<30;n++,d.setDate(d.getDate()+1))if(work(d))a.push(iso(d));return a}
function okInsts(u,date,hrs){return insts().map((_,i)=>i).filter(i=>plan(u,i,date,hrs))}

function render(){
  const nm=S.bookings.filter(b=>stOf(b)==="Requested").length,na=S.bookings.filter(b=>stOf(b)==="Approved").length,nr=S.bookings.filter(b=>stOf(b)==="Ready").length;const tabs=[["book","Book"],["sched","Schedule"],["mgr","Manager approval"+(nm?" ("+nm+")":"")],["queue","Advisor queue"+(na?" ("+na+")":"")],["inst","Installer"+(nr?" ("+nr+")":"")]];if(S.can)tabs.push(["sheet","Services"],["admin","Admin"]);
  $("#tabs").innerHTML=tabs.map(t=>`<button class="tab ${S.tab===t[0]?"on":""}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join("");
  $("#view").innerHTML={mgr:mgrView,inst:schedView,book:bookView,sched:schedView,queue:queueView,sheet:sheetView,admin:adminView}[S.tab]();
  drawAlerts();
}
function soft(){const a=document.activeElement;if(a&&a.closest&&a.closest("#view")&&a.matches("input,textarea"))S.pend=1;else render()}
document.addEventListener("focusout",()=>{if(S.pend)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches("input,textarea"))){S.pend=0;render()}},350)});

function card(b,d,o,h){
  const i=d?b.days.findIndex(x=>x.d===d):-1,last=b.days[b.days.length-1].d;
  const f0=b.days[0],when="Starts "+lab(b.start)+(f0&&f0.o!=null?" "+tm(clk(f0.o,0)):"");
  const st=stOf(b),act=S.tab==="mgr"&&st==="Requested"?`<button class="btn" data-a="setst" data-id="${esc(b.id)}" data-v="Approved">Approve</button><button class="btn x" data-a="setst" data-id="${esc(b.id)}" data-v="Declined">Decline</button>`:S.tab==="queue"&&st==="Approved"?`<button class="btn" data-a="setst" data-id="${esc(b.id)}" data-v="Ready">Ready for install</button>`:S.tab==="inst"&&st==="Ready"?`<button class="btn" data-a="setst" data-id="${esc(b.id)}" data-v="Done">Mark done</button>`:"";
  return `<div class="bk ${st==="Requested"?"new":""}">${d&&o!=null?`<div class="tm">${d===b.start?tm(clk(o,0)):"Continued"}</div>`:""}<b>${esc(b.veh||b.ref)}</b> <span class="pill">${st}</span>${b.veh&&b.ref?" · "+esc(b.ref):""}<div class="mu">${esc(IT(b))}</div>
  <div class="mu">${[when,b.pt?"Customer promise: "+pEnd(b):"",insts().length>1?esc(insts()[b.inst]||""):"","booked by "+esc(b.by||"?"),b.adv?"advisor "+esc(b.adv):"",b.aby?"approved by "+esc(b.aby):"",b.advSale?"advisor sale, no approval needed":"",b.cust?esc(b.cust):"",b.note?esc(b.note):""].filter(Boolean).join(" · ")}</div>
  <div class="acts">${act}
  ${advs().length&&S.tab==="queue"?`<select data-a="adv" data-id="${esc(b.id)}" aria-label="Advisor">${[...new Set([...(b.adv?[b.adv]:[]),...advs()])].map(a=>`<option ${a===b.adv?"selected":""}>${esc(a)}</option>`).join("")}</select>`:""}${S.tab!=="sched"&&S.tab!=="inst"?`<button class="btn alt" data-a="edit" data-id="${esc(b.id)}">Edit</button><button class="btn x" data-a="cancel" data-id="${esc(b.id)}">Cancel</button>`:""}</div></div>`;
}
function dayCard(d){
  const u=usage(S.bookings);
  return `<div class="card"><b>${lab(d)}</b> <span class="mu">${tm(clk(0,0))} – ${tm(clk(cap(),1))}, lunch ${tm(sh()+lo())}</span>`+insts().map((n,i)=>{
    const used=(u[i]||{})[d]||0,bs=slots(d,i,S.bookings);
    return `<div style="margin-top:8px"><span class="mu">${esc(n)} · ${fh(used)} of ${fh(cap())} booked</span><div class="bar"><i style="width:${Math.min(100,used/cap()*100)}%"></i></div>${bs.map(s=>card(s.b,d,s.o,s.h)).join("")||(work(parse(d))?'<div class="mu">Nothing booked.</div>':'<div class="mu">Closed.</div>')}</div>`}).join("")+`</div>`;
}
function schedView(){
  return `<div class="row noprint"><div><label>Search (vehicle, RO/stock, customer, advisor)</label><input data-f="q" value="${esc(S.q)}" type="search"></div><div style="flex:0 0 auto;align-self:end"><button class="btn alt" data-a="print">Print day</button></div></div><div id="res">${resHtml()}</div>`;
}
function resHtml(){
  const q=S.q.trim().toLowerCase();

function calView(hrs,u){

  for(let n=0;n<42;n++){const d=new Date(s);d.setDate(s.getDate()+n);const k=iso(d),live=k>=t&&work(d),ok=live&&okInsts(u,k,hrs).length;

async function saveSheet(){
  try{
    const sv=JSON.parse(JSON.stringify(S.sheet));
    if(!sv.length)throw new Error("Keep at least one service.");
    sv.forEach(s=>{
      if(!String(s.name).trim())throw new Error("Every service needs a name.");
      ["options","addons"].forEach(k=>{s[k]=s[k].filter(o=>String(o.n).trim()).map(o=>{
        const h=Number(o.h);if(!(h>=0))throw new Error("Hours must be a number: "+o.n);
        const x={n:String(o.n).trim(),h};if(o.q===true)x.q=true;
        if(String(o.pt??"")!==""){const q=Number(o.pt);if(!(q>=0))throw new Error("Promise hours must be a number: "+o.n);x.pt=q}
        if(String(o.pr??"")!==""){const p=Number(o.pr);if(!(p>=0))throw new Error("Price must be a number: "+o.n);x.pr=p}
        if(Array.isArray(o.prt)){const arr=(s.tiers||[]).map((_,k)=>{const v=o.prt[k];if(v==null||String(v)==="")return null;const p=Number(v);if(!(p>=0))throw new Error("Price must be a number: "+o.n);return p});if(arr.some(v=>v!=null))x.prt=arr}
        return x})});
      if(!s.options.length)throw new Error(s.name+" needs at least one option.");
    });
    const c={...S.cfg,services:sv};
    if(db)await db.doc("config/catalog").set({json:JSON.stringify(c)});
    S.cfg=c;S.sheet=null;S.items=[];S.date=null;S.ok=true;S.msg="Saved.";
  }catch(err){S.ok=false;S.msg="Not saved: "+err.message}
  render();
}

  else if(a==="resetCfg")return saveCfg(true);
  render();
});

function pickAdv(all){const l=advs();if(!l.length)return "";const r=all.filter(b=>b.rot&&l.includes(b.rot)).sort((a,b)=>(b.created||"").localeCompare(a.created||""))[0];return r?l[(l.indexOf(r.rot)+1)%l.length]:l[0]}
async function confirm(){
  const hrs=total(),btn=$('[data-a="confirm"]'),edit=S.editId,sold=S.f.sold||"";
  if(qtyMissing().length){S.ok=false;S.msg="Choose a quantity for: "+qtyMissing().join(", ")+".";return render()}
  if(!(S.f.by||"").trim()){S.ok=false;S.msg="Enter who is booking this.";return render()}
  
  if(!(S.f.veh||"").trim()){S.ok=false;S.msg="Enter the vehicle.";return render()}
  if(!(S.f.ref||"").trim()){S.ok=false;S.msg="Enter the stock number or VIN.";return render()}
  if(S.ovn&&S.ack!==S.key){S.modal=1;return render()}
  btn.disabled=true;
  try{
    let lock=!db;
    for(let n=0;db&&n<6&&!lock;n++){const r=await db.doc("locks/schedule").acquire({holder:me,ttlMs:8000});if(r.acquired)lock=true;else await new Promise(r=>setTimeout(r,500))}
    if(!lock){S.ok=false;S.msg="The schedule is busy. Try again in a moment.";return render()}
    const all=(db?(await db.collection("bookings").get()).docs.map(d=>({id:d.id,...d.data()})):S.bookings).filter(b=>b.status!=="Declined");
    const u=occ(edit?all.filter(b=>b.id!==edit):all),ok=okInsts(u,S.date,hrs).filter(x=>plan(u,x,S.date,hrs,S.tm));
    const i=S.inst==="auto"?ok[0]:(ok.includes(+S.inst)?+S.inst:undefined);
    const pl=i!=null?plan(u,i,S.date,hrs,S.tm):null;
    if(!pl){S.bookings=all;S.ok=false;S.msg="Someone just took that slot. Pick another date.";return render()}
    const bk={inst:i,start:S.date,days:pl,items:S.items.map(it=>itemLabel(svc(it.sid),it)),its:S.items.map(x=>({...x,ad:[...x.ad],q:{...(x.q||{})}})),total:hrs,pt:extras().pt,veh:S.f.veh.trim(),ref:S.f.ref.trim(),by:S.f.by.trim(),note:(S.f.note||"").trim()};
    if(edit){if(db)await db.doc("bookings/"+edit).update(sold?{...bk,sby:me}:{...bk,status:"Requested",aby:"",sby:me});else Object.assign(S.bookings.find(x=>x.id===edit),bk);S.tab="sched";toast("Booking updated")}
    else{const nb={...bk,adv:(S.asg=sold||(S.rot=pickAdv(all))),rot:sold?"":S.rot,advSale:!!sold,status:sold?"Approved":"Requested",mid:me,created:new Date().toISOString()};if(db)await db.collection("bookings").add(nb);else S.bookings.push({id:"l"+Date.now(),...nb});}
    S.items=[];S.date=null;S.inst="auto";S.editId=null;S.f={by:S.f.by};S.ok=true;S.msg=edit?"":sold?"Booked for "+sold+". No approval needed.":"Request sent for manager approval"+(insts().length>1?" with "+insts()[i]:"")+". Routed to "+(S.asg||"an advisor")+".";
  }catch(err){S.ok=false;S.msg="Could not save: "+(err&&err.message||err)}
  render();
}
async function saveCfg(reset){
  try{
    const c=reset?DEF:JSON.parse($("#cfg").value);
    if(!c.shop||!Array.isArray(c.shop.installers)||!c.shop.installers.length||!(c.shop.dayHours>0)||!Array.isArray(c.shop.workDays)||!Array.isArray(c.services)||!c.services.length)throw new Error("Need shop.installers, shop.dayHours, shop.workDays and services.");
    c.services.forEach(s=>{if(!s.id||!s.name||!Array.isArray(s.options)||!s.options.length)throw new Error("Each service needs id, name and options.");s.addons=s.addons||[]});
    if(db)await db.doc("config/catalog").set({json:JSON.stringify(c)});
    S.cfg=c;S.items=[];S.date=null;S.ok=true;S.msg="Saved.";
  }catch(err){S.ok=false;S.msg="Not saved: "+err.message}
  render();
}
(async()=>{
  try{if(window.claude){db=await claude.use("db");const u=await claude.use("user");S.can=u?!!(await u.canEdit()):false}}catch(e){db=null}
  if(!window.claude)S.can=true;
  if(db){
    let first=true;
    db.doc("config/catalog").onSnapshot(s=>{if(s.exists){try{S.cfg=JSON.parse(s.data().json)}catch(e){}}if(S.tab!=="admin")soft()});
    db.collection("bookings").onSnapshot(s=>{
      if(!first)s.docChanges().forEach(c=>{const b=c.doc.data(),id=c.doc.id,old=S.all.find(x=>x.id===id),stg=stOf(b),mine=c.type==="added"?b.mid===me:b.sby===me;if(!mine&&!(b.advSale&&c.type==="added")&&b.status!=="Declined"&&(c.type==="added"||(c.type==="modified"&&old&&stOf(old)!==stg))&&LBL[stg]&&wants(stg))notify(b,id,LBL[stg])});
      first=false;S.all=s.docs.map(d=>({id:d.id,...d.data()}));S.bookings=S.all.filter(b=>b.status!=="Declined");soft();
    },e=>{});
  }else $("#banner").innerHTML='<div class="banner">Not connected to the shared schedule. Bookings made here are temporary and visible only to you. Open the published link while signed in to claude.ai.</div>';
  
  
  
  render();
})();
